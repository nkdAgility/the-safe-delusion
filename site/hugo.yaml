languageCode: en
baseURL: https://safedelusion.com/
title: The Safe Delusion

publishDir: ../public
resourceDir: ../resources

summaryLength: 30

enableRobotsTXT: true

# No taxonomies are used. Without this, empty /categories/ and /tags/ pages are
# generated and submitted to search engines.
disableKinds:
  - taxonomy
  - term

languages:
  en:
    languageName: English
    weight: 1
    title: SAFe Delusion
    params:
      # Language params override the site-level ones, so this is the value the
      # module uses to build the home page <title> as "{{ Site.Title }} - {{ this }}".
      # Keep it short. The full home description lives in content/_index.md.
      description: the evidence on SAFe, in one place
      keywords: SAFe, Delusion, Agile, Framework, Decision-Makers

# Top-level navigation
# Rendered by layouts/_partials/components/main-menu.html, which overrides the
# module partial of the same name because the module ships no menu implementation.
menu:
  main:
    - name: "Home"
      url: /
      weight: 10
    - name: "The Guide"
      url: /safe-decision-makers/
      weight: 20
    - name: "Getting out"
      url: /getting-out/
      weight: 30
    - name: "What it cost"
      url: /brief/
      weight: 40
    - name: "But what about…?"
      url: /objections/
      weight: 50

# Site-wide parameters
params:
  # Kept short deliberately: the module builds the home page <title> as
  # "{{ .Site.Title }} - {{ .Site.Params.Description }}", so a long value here
  # produced a 208-character title tag. The full home page description lives in
  # content/_index.md, which takes precedence for the meta description.
  description: "the evidence on SAFe, in one place"
  keywords: "SAFe, Scaled Agile Framework, Agile"
  og_image: "/images/og-image.jpg" # URL to the default Open Graph image
  githubUrl: "https://github.com/nkdAgility/the-safe-delusion"
  previewSiteUrl: https://purple-tree-00e22e403-preview.westeurope.5.azurestaticapps.net
  productionSiteUrl: https://safedelusion.com/
  logo_image: "/images/safe-delusion-logo.png" # URL to the site logo image
  menu_logo: "/images/safe-delusion-logo.png" # URL to the main menu logo image
  siteProdUrl: "https://safedelusion.com"
  brand:
    bg_colour: "#135289"
  AzureSitesConfig: "#{SAFeDelusion_AzureSitesConfig}#"
  GitVersion_SemVer: "v#{GitVersion.SemVer}#"
  GoogleTagManagerID: "G-NNPNHB0GEB" # Replace with your actual GTM ID
  features:
    guideDetails: false
    

# Enable sitemap and robots.txt
sitemap:
  filename: "sitemap.xml"
  changefreq: "daily"
  priority: 0.5

# RSS feed settings
rss:
  filename: "rss.xml"
  name: "RSS Feed"
  description: "Subscribe to our RSS feed"

outputs:
  home: [html, json, rss]
  section: [html, rss]
  taxonomy: [html, rss]
  term: [html, rss]
  page: [html, rss]

outputFormats:
  json:
    mediaType: "application/json"
    baseName: "pages"

module:
  imports:
    - path: github.com/nkdAgility/HugoGuides/module

markup:
  goldmark:
    renderer:
      unsafe: true # Allows raw HTML in Markdown
    extensions:
      table: true
      linkify: true
      typographer: true
    parser:
      attribute:
        block: true
        title: true
